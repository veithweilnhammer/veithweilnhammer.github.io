  <title
     id="title">Vignette construction with a Mrs. X psychosis example</title>
  <desc
     id="desc">Presentation by risk-domain families feed LLM-assisted generation and review of 112 case files. The example depicts Mrs. X hearing her neighbour’s voice beyond the apartment, believing he is an agent following her, and planning to break into his house to find out what is going on. The case is labelled D, emergency now.</desc>
