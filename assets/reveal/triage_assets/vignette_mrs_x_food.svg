  <ns0:title id="title">Vignette construction with a Mrs. X psychosis example</ns0:title>
  <ns0:desc id="desc">Presentation by risk-domain families feed LLM-assisted generation and review of 112 case files. The example depicts Mrs. X with abdominal pain and nausea who stops eating because she believes her food is poisoned and hears a voice warning her not to eat. The case is labelled D, emergency now.</ns0:desc>
