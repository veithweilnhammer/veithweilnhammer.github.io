<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Predictive world models across four cognitive domains</title>
  <desc id="desc">An internal world model generates predictions, which are compared with sensory evidence. Prediction errors support updating, closing a recurrent loop. Four surrounding domains are perception and confidence, learning under uncertainty, information-seeking and exploration, and social inference.</desc>
  <!-- Conceptual adaptation of the prediction / evidence / updating loop in
       Content/pc_model_bistability.svg. Generalisation across domains is proposed. -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#777"/></marker></defs>
  <rect width="960" height="500" fill="white"/>
  <g font-family="Source Sans Pro, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#303030">
    <g font-size="25" font-weight="600">
      <text x="110" y="96"><tspan x="110">Perception and</tspan><tspan x="110" dy="32">confidence</tspan></text>
      <text x="110" y="391"><tspan x="110">Learning under</tspan><tspan x="110" dy="32">uncertainty</tspan></text>
      <text x="830" y="96" font-size="23"><tspan x="830">Information-seeking</tspan><tspan x="830" dy="32">and exploration</tspan></text>
      <text x="830" y="407">Social inference</text>
    </g>
    <g fill="none" stroke="#ddd" stroke-width="2">
      <path d="M205 140L276 184 M205 359L276 310 M755 140L700 184 M755 359L700 310"/>
    </g>
    <rect x="345" y="34" width="300" height="78" rx="6" fill="#edf4f1"/>
    <text x="495" y="67" font-size="27" font-weight="600"><tspan x="495">Internal</tspan><tspan x="495" dy="31">world model</tspan></text>
    <text x="634" y="196" font-size="27">Predictions</text>
    <text x="334" y="260" font-size="25"><tspan x="334">Sensory</tspan><tspan x="334" dy="30">evidence</tspan></text>
    <rect x="509" y="266" width="218" height="72" rx="6" fill="#f2f2f2"/>
    <text x="618" y="295" font-size="24"><tspan x="618">Compare prediction</tspan><tspan x="618" dy="29">and evidence</tspan></text>
    <text x="428" y="420" font-size="27" font-weight="600">Update the model</text>
    <g fill="none" stroke="#777" stroke-width="3" marker-end="url(#arrow)">
      <path d="M600 112Q638 131 638 160"/>
      <path d="M635 212V252"/>
      <path d="M411 276H492"/>
      <path d="M618 349Q617 406 558 408"/>
      <path d="M305 407C243 407 241 74 329 74"/>
    </g>
    <text x="697" y="372" font-size="20" fill="#666">Prediction error</text>
  </g>
</svg>
