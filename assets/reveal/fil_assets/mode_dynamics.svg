<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
<title id="title">Conceptual cognitive-mode occupancy and transitions</title>
<desc id="desc">An illustrative sequence of stronger belief reliance and greater evidence responsiveness. Duration and switching are quantities to estimate, not measured results.</desc>
<style>text{font-family:Arial,sans-serif;fill:#333;font-size:22px}.small{font-size:19px}.belief{fill:#248b79}.evidence{fill:#cf814c}</style>
<text x="0" y="27" class="belief">Stronger reliance on existing beliefs</text><text x="0" y="57" class="evidence">Greater responsiveness to new information</text>
<text x="0" y="116" class="small">Candidate mode</text>
<g transform="translate(0 138)"><rect width="225" height="65" class="belief"/><rect x="225" width="100" height="65" class="evidence"/><rect x="325" width="300" height="65" class="belief"/><rect x="625" width="185" height="65" class="evidence"/><rect x="810" width="110" height="65" class="belief"/>
<g fill="none" stroke="white" stroke-width="3"><path d="M225 0v65 M325 0v65 M625 0v65 M810 0v65"/></g></g>
<g fill="none" stroke="#555" stroke-width="2"><path d="M325 219v10h300v-10"/><path d="M225 134v-32"/><path d="M0 265h920"/></g>
<text x="475" y="254" text-anchor="middle" class="small">Persistence within a mode</text><text x="235" y="113" class="small">Transition</text>
<text x="0" y="295" class="small">Continuous recording over seconds to minutes</text><text x="920" y="295" text-anchor="end" class="small">Time</text>
</svg>