<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="395" height="230" viewBox="190 335 395 230" role="img" version="1.1" id="svg4" sodipodi:docname="B2_01_wp1_wp2_wp3_v3_compact.svg" inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)" xml:space="preserve" inkscape:export-filename="B2_01_wp1_wp2_wp3_v3_compact.png" inkscape:export-xdpi="180" inkscape:export-ydpi="180"><title id="title">Structural draft: learn shared geometry, add new people, follow people through it</title><desc id="description">Compact V3 working copy derived directly from the previous V3. The WP1 preliminary-evidence strip has shorter grey subtitles, smaller scientific plots, and a simple Text / Frozen LLM / Internal activations / Linear readout pipeline. All empirical observations, model estimates and confidence intervals are unchanged. The intact WP1 mapping is translated upward by 80 SVG units (11.3 mm), without resizing or modifying internal artwork. As requested after checking the existing heading positions, compression takes priority over exact WP1/WP3 heading alignment; WP2 and WP3 remain entirely unchanged. Original V2 and V3 files are preserved, as are the fixed page size and all other objects. Targeted revision to the manually edited V3: the inference-time pilot now has the heading 'Non-verbal decoding' and the two-line explanation 'Digital behavior decodes mental states from brief observations'. It is uniformly reduced to match the adjacent simulation pilot's height, with original data paths, observations, y-axis presentation and inference-time labels retained. Both empirical panels have aligned headings, explanatory text starts, plot tops, plot bottoms and axis-label baselines. The simulation description and points are unchanged. No pathway, geometric map, study design, preliminary-evidence object, WP2/WP3 element or figure legend is modified.</desc><defs id="defs4"><style id="style1">text {font-family:Arial,Helvetica,sans-serif}</style><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0,0 8,4 0,8 Z" fill="#243746" id="path1"/></marker><clipPath id="individual-affect-projections-clip"><rect x="595" y="469" width="210" height="205" id="rect12-53"/></clipPath><marker id="arrow-ink-26" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0,0 8,4 0,8 Z" fill="#243746" id="path1-9"/></marker><marker id="arrow-ink-3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0,0 8,4 0,8 Z" fill="#243746" id="path1-78"/></marker></defs><rect width="1195.0027" height="962.2514" fill="#ffffff" id="rect4" x="-2.7755576e-17" y="8.8817842e-16" style="stroke-width:0.988839"/><g id="explicit-arousal-valence" transform="translate(369.27686,211.96576)"><g id="g287" transform="translate(0,-2.3381948)"><g id="g286"><g id="individual-affect-projections" clip-path="url(#individual-affect-projections-clip)"/></g></g></g><g id="g30" transform="translate(-0.2292058,14.951262)"><text id="v3-compact-text-5" x="577.83405" y="335.79129" fill="#5c7182" font-size="14.9412px" font-weight="normal" text-anchor="start" style="text-align:end;text-anchor:end"><tspan sodipodi:role="line" id="tspan7" x="577.83405" y="335.79129">Pilot data: Linear probes decode self-reported</tspan><tspan sodipodi:role="line" id="tspan8" x="577.83405" y="354.4678">anxiety and its changes from human text</tspan></text><g id="g17" transform="translate(-18.67647)"><g id="g8" transform="rotate(90,269.31721,442.91941)"><rect id="v3-compact-rect-27" x="-