<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="245" height="260" viewBox="955 460 245 260" role="img" version="1.1" id="svg353" sodipodi:docname="B1_02_approach.svg" inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)" xml:space="preserve" inkscape:export-filename="B1_02_approach.png" inkscape:export-xdpi="360" inkscape:export-ydpi="360"><title id="figure-title">Connecting psychological measurements and digital behavior</title><desc id="figure-description">MANIFEST figure with a focused clarity revision. The two right-hand encoder and numerical-vector rows align horizontally with self-reports and task-derived measures. Their labeled input streams stay separate and their outputs join only after encoding. Short row-specific connectors replace crossing raw-input buses. Outlined person/device vignettes and clearer task, chat, cursor and touch actions match the approved typing/editing style, which remains unchanged. The left pilot retains all 18 original association coordinates with dots enlarged by about 47 percent, directly labeling Depression, Anxiety and Overall wellbeing. Axes explicitly describe correlations of self-reported and decoded states with belief instability. The right axis states Prediction accuracy (correlation); all three observed values are unchanged. Central space geometry, scale and points are unchanged; the shorter encoder band creates more room above the space headings. The input illustrations and numerical profiles are schematic, while the two side pilots retain their original aggregate empirical data.</desc><defs id="defs18"><style id="style1">text{font-family:Arial,Helvetica,sans-serif;}.plot-annotation{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;}.plot-annotation{stroke-width:3px;}</style></defs><rect width="1199.9973" height="774.4967" fill="#ffffff" id="rect4" x="0" y="0" style="stroke-width:0.862965"/><g id="g8" transform="translate(0,-1.3206259)"><rect width="1200" height="657" fill="#ffffff" id="rect1" x="-3.529467e-07" y="51.185192"/></g><path d="m 1029.9412,646.53813 h 165" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path337"/><text x="1022.9412" y="651.53815" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text338">0.0</text><path d="m 1029.9412,596.53813 h 165" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path338"/><text x="1022.9412" y="601.53815" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text339">0.1</text><path d="m 1029.9412,546.53813 h 165" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path339"/><text x="1022.9412" y="551.53815" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text340">0.2</text><path d="m 1029.9412,496.53813 h 165" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path340"/><text x="1022.9412" y="501.53812" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text341">0.3</text><path d="m 1029.9412,486.53813 v 160" fill="none" stroke="#243746" stroke-width="0.871569" stroke-linecap="round" stroke-linejoin="round" id="path341"/><path d="M 1065.3205,646.48925 V 573.15377" fill="none" stroke="#2864a0" stroke-width="0.871569" stroke-linecap="round" stroke-linejoin="round" id="path343" style="fill:#ffffff;fill-opacity:1;stroke:#616f7a;stroke-width:2.42118;stroke-linecap:butt;stroke-dasharray:none" sodipodi:nodetypes="cc"/><circle cx="1065.3204" cy="567.53192" r="3.75" fill="#2864