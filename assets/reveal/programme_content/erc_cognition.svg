<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="255" height="255" viewBox="0 455 255 255" role="img" version="1.1" id="svg353" sodipodi:docname="B1_02_approach.svg" inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)" xml:space="preserve" inkscape:export-filename="B1_02_approach.png" inkscape:export-xdpi="360" inkscape:export-ydpi="360"><title id="figure-title">Connecting psychological measurements and digital behavior</title><desc id="figure-description">MANIFEST figure with a focused clarity revision. The two right-hand encoder and numerical-vector rows align horizontally with self-reports and task-derived measures. Their labeled input streams stay separate and their outputs join only after encoding. Short row-specific connectors replace crossing raw-input buses. Outlined person/device vignettes and clearer task, chat, cursor and touch actions match the approved typing/editing style, which remains unchanged. The left pilot retains all 18 original association coordinates with dots enlarged by about 47 percent, directly labeling Depression, Anxiety and Overall wellbeing. Axes explicitly describe correlations of self-reported and decoded states with belief instability. The right axis states Prediction accuracy (correlation); all three observed values are unchanged. Central space geometry, scale and points are unchanged; the shorter encoder band creates more room above the space headings. The input illustrations and numerical profiles are schematic, while the two side pilots retain their original aggregate empirical data.</desc><defs id="defs18"><style id="style1">text{font-family:Arial,Helvetica,sans-serif;}.plot-annotation{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;}.plot-annotation{stroke-width:3px;}</style></defs><rect width="1199.9973" height="774.4967" fill="#ffffff" id="rect4" x="0" y="0" style="stroke-width:0.862965"/><g id="g8" transform="translate(0,-1.3206259)"><rect width="1200" height="657" fill="#ffffff" id="rect1" x="-3.529467e-07" y="51.185192"/></g><g id="g18"><path d="m 80.037736,486.5381 v 160" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path234"/><path d="M 64,631.44376 H 234" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path235"/><text x="80.037735" y="661.8028" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="middle" id="text235">-0.2</text><text x="60.735294" y="636.44373" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text236">-0.2</text><path d="m 144.18868,486.5381 v 160" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path236"/><path d="M 64,571.0664 H 234" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path237"/><text x="144.18867" y="661.8028" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="middle" id="text237">0</text><text x="60.735294" y="576.06641" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="end" id="text238">0</text><path d="m 208.33962,486.5381 v 160" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path238"/><path d="M 64,510.68904 H 234" fill="none" stroke="#e0e6ea" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" id="path239"/><text x="208.33963" y="661.8028" font-size="14.9412px" fill="#5c6f7b" font-weight="normal" text-anchor="middle" id="text239">0.2</text><text x="60.735294" y="515.68909" font-size="14.9412px" fill="#5c6f7b" font-weight="normal